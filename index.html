<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/fundi-admin/">

  <meta charset="UTF-8">
  <meta name="theme-color" content="#0F172A">
  <meta name="robots" content="noindex, nofollow">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fundi Admin, for Fundi's team.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fundi Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fundi Admin</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The page behind Flutter's canvas.

    Anything the engine fails to paint - a frame that drops, a draw op whose
    shader won't compile on the machine's GPU - shows whatever is underneath
    the canvas. Left unset that is white, which is what a white flash is.
    Painting it the app's own background makes those moments invisible.

    This follows the OS setting, which is what the app defaults to. Someone
    who has pinned the app to the opposite mode can still catch a flash of
    the other colour, which is far less jarring than white.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;  /* FundiColors.background, light */
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #0F172A; }  /* ...and dark */
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
